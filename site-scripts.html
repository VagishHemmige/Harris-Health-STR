<!--
Small fixes applied to every page after it loads (included by _quarto.yml).
They change only how pages are shown, never their content:
- tables scroll sideways inside their own box on narrow screens;
- table column headers get scope="col" for screen readers;
- the empty title heading on pages that show a root document is removed;
- each R code fold is named after its step;
- folded code opens for printing.
-->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var main = document.querySelector("main") || document.body;

  main.querySelectorAll("table").forEach(function (table) {
    table.querySelectorAll("thead th").forEach(function (th) {
      if (!th.hasAttribute("scope")) th.setAttribute("scope", "col");
    });
    var parent = table.parentElement;
    if (parent && !parent.classList.contains("table-scroll") &&
        !table.closest(".sourceCode")) {
      var box = document.createElement("div");
      box.className = "table-scroll";
      parent.insertBefore(box, table);
      box.appendChild(table);
      // A caption inside the table would scroll away with it, so it moves
      // above the box and still labels the table for screen readers.
      var caption = table.querySelector("caption");
      if (caption) {
        var label = document.createElement("div");
        label.className = "table-caption";
        label.id = "table-caption-" + Math.random().toString(36).slice(2, 9);
        label.innerHTML = caption.innerHTML;
        parent.insertBefore(label, box);
        table.setAttribute("aria-labelledby", label.id);
        caption.remove();
      }
    }
  });

  document.querySelectorAll("h1").forEach(function (h) {
    if (h.textContent.trim() === "") h.remove();
  });

  main.querySelectorAll("details.code-fold").forEach(function (det) {
    var summary = det.querySelector("summary");
    if (!summary) return;
    var name = "";
    var cell = det.closest(".cell");
    var next = cell ? cell.nextElementSibling : null;
    if (next && next.id && next.id.indexOf("r-") === 0) {
      name = next.id.slice(2).replace(/-/g, " ");
    } else {
      var section = det.closest("section");
      var heading = section ? section.querySelector("h2, h3, h4") : null;
      if (heading) name = heading.textContent.trim();
    }
    summary.textContent = name ? "R code: " + name : "R code";
  });

  var openedForPrint = [];
  window.addEventListener("beforeprint", function () {
    document.querySelectorAll("details:not([open])").forEach(function (d) {
      d.setAttribute("open", "");
      openedForPrint.push(d);
    });
  });
  window.addEventListener("afterprint", function () {
    openedForPrint.forEach(function (d) { d.removeAttribute("open"); });
    openedForPrint = [];
  });
});
</script>
